<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farah & Zeyad</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="page">
  <section class="invitation">
    <img src="images/invitation.png" alt="Farah & Zeyad wedding invitation">
  </section>

  <section class="details">
    <div class="countdown">
      <div><span id="days">00</span><small>Days</small></div>
      <div><span id="hours">00</span><small>Hours</small></div>
      <div><span id="minutes">00</span><small>Minutes</small></div>
      <div><span id="seconds">00</span><small>Seconds</small></div>
    </div>

    <div class="actions">
      <a class="button" href="https://www.google.com/maps/search/?api=1&query=Le+Passage+Cairo+Hotel" target="_blank" rel="noopener">Location</a>
      <a class="button" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Farah%20%26%20Zeyad%20Wedding&dates=20261030T160000Z/20261030T190000Z&location=Le%20Passage%20Cairo%20Hotel" target="_blank" rel="noopener">Save the Date</a>
    </div>

    <label class="rsvp">
      <input id="attending" type="checkbox">
      <span class="check"></span>
      <span>I'm attending</span>
    </label>
    <p id="rsvpNote" class="note"></p>
  </section>
</main>
<script src="js/script.js"></script>
</body>
</html>
